version: '3.8'\nservices:\n  api:\n    image: tiangolo/uvicorn-gunicorn-fastapi:python3.8\n    volumes:\n      - ./app:/app\n    ports:\n      - '8000:80'\n    environment:\n      - MONGODB_URL=mongodb://mongo:27017/ubigeos\n\n  redis:\n    image: redis:alpine\n    ports:\n      - '6379:6379'\n\n  mongo:\n    image: mongo:latest\n    ports:\n      - '27017:27017'\n    environment:\n      - MONGO_INITDB_DATABASE=ubigeos\n      - MONGO_INITDB_ROOT_USERNAME=root\n      - MONGO_INITDB_ROOT_PASSWORD=example\n\nnetworks:\n  default:\n    driver: bridge\n